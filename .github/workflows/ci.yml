name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin has no dependencies and no build step: the checks are the
      # boot simulation (both halves under stubs) and the Client interaction
      # rules (resource coroutine, close recovery, guide routing, bridge teardown).
      - name: Boot simulation
        run: node dev/boot-sim.mjs
      - name: Client interaction tests
        run: node --test dev/
